# core/globals.conf

# Utilisateur et machine
export OB_USER=$(whoami)
export OB_HOST=$(hostname)

# Dossiers de base
export OB_DIR="/opt/games"                          # Dossier de base

# Dossiers de sortie
export OB_DIST_DIR="$OB_DIR/dist"                   # Dossier Dist      : Les jeux et leurs variantes.
export OB_ASSETS_DIR="$OB_DIR/assets"               # Dossier d'assets  : Les ressources ; mods, textures, packages, sons etc...
export OB_LAUNCH_DIR="$OB_DIR/launch"               # Les launchers     : Préfixés par "game-XXX" à ajouter dans le PATH (ex: export OB_PATH="$PATH:/opt/games/launch")
export OB_LIBS_DIR="$OB_DIR/libs"                   # Les libs          : Bibliothèques spécifiques non proposées par defaut dans la distri Linux
export OB_ENGINES_DIR="$OB_DIR/engines"             # Les moteurs       : Une fois compilés les moteurs sont stockés dans engines/

# Dossiers CORE
export OB_CORE_DIR="${OB_DIR}/core"
export OB_CORE_SRC="${OB_CORE_DIR}/src"             # Dossier où sont recupérées les sources git
export OB_CORE_LOG="${OB_CORE_DIR}/logs"            # Dossier des logs de compilations
export OB_CORE_HELPERS="${OB_CORE_DIR}/helpers"     # Dossier de fonctions pas d'execution direct
export OB_CORE_SCRIPTS="${OB_CORE_DIR}/scripts"     # Dossier scripts de builds
export OB_CORE_VARIANTS="${OB_CORE_DIR}/variants"   # Dossier des Recettes d'assemblage d'un jeu (dist)
export OB_CORE_INCLUDES="${OB_CORE_DIR}/includes"   # Dossier de dependances, libs supplèmentaires parfois necessaire à une compilation...

# Nom du fichier d'entete des launcher
export OB_LAUNCH_FILE="_launch"                     # Script à sourcer aux launchers

# Paramètres de compilation
export OB_MAKE_JOBS=2                                                       # Nombre de coeurs cpu a utiliser pour la compilation
export CFLAGS="-O3 -march=native -pipe -fno-plt -flto -fno-strict-aliasing" # Optimisations compilateur C
export CXXFLAGS="$CFLAGS"                                                   # Optimisations compilateur C++
export LDFLAGS="-flto -Wl,-O1 -Wl,--as-needed"                              # Optimisations éditeur de liens (Assemblage final)

# Infos de Compilations
export OB_CFLAGS_DESC="Optimisations >= SSE4.1 Intel Serie Q8xxx/Q9300/Q9400/Q9500/Q9600/X3300"
export OB_CPU_DESC=$(grep -m1 "model name" /proc/cpuinfo | cut -d: -f2 | xargs)

